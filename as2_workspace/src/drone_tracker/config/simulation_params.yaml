/**:
  ros__parameters:
    # Simulation Settings
    use_sim_time: true
    
    # Drone Configuration
    drone:
      id: "drone0"
      frame_id: "drone0/base_link"
      mass: 1.0  # kg
      max_thrust: 20.0  # N
      max_angular_velocity: 1.5  # rad/s
      
      # Physical properties
      inertia:  # kg*m^2
        ixx: 0.01
        iyy: 0.01
        izz: 0.02
      
      # Sensor configuration
      camera:
        frame_id: "drone0/camera_link"
        topic: "/camera/image_raw"
        info_topic: "/camera/camera_info"
        width: 640
        height: 480
        fov: 1.0472  # 60 degrees in radians
        update_rate: 30.0  # Hz
        
      # PID Controller gains
      control:
        position:
          p: [1.0, 1.0, 1.0]  # x, y, z
          i: [0.0, 0.0, 0.1]
          d: [0.0, 0.0, 0.0]
        attitude:
          p: [1.0, 1.0, 1.0]  # roll, pitch, yaw
          i: [0.0, 0.0, 0.0]
          d: [0.0, 0.0, 0.0]

    # World Configuration
    world:
      frame_id: "world"
      gravity: -9.81  # m/s^2
      
    # Target Object Configuration
    target:
      frame_id: "target_link"
      model_name: "tracking_target"
      
    # ROS Bridge Settings
    bridge:
      image_topic: "/camera/image_raw"
      clock_topic: "/clock"
      tf_topic: "/tf"